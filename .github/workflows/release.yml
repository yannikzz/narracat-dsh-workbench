name: Release

# Push a tag such as v1.0.10 to build/test the bundle, pack it, and attach the
# tarball to a GitHub Release. npm publishing is intentionally separate: it goes
# through npm staged publishing and a maintainer 2FA approval (see docs/RELEASING.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build client
        run: npm run build
      - name: Regression suite
        run: npm test
      - name: Pack bundle
        run: npm run pack:bundle
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
